:root{--bg:#0d0f14;--surface:#161921;--surface2:#1e222e;--border:#2a2f3d;--text:#e4e8f0;--muted:#8890a4;--accent:#4f8ef7;--zero:#2a2f3d;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:13px;line-height:1.5;}
header{padding:14px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface);position:sticky;top:0;z-index:100;}
.ht h1{font-size:16px;font-weight:700;} .ht p{font-size:11px;color:var(--muted);margin-top:1px;}
.badge{background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;}
.sp{display:flex;gap:14px;}
.sp .num{font-size:18px;font-weight:900;font-family:'DM Mono',monospace;color:var(--accent);}
.sp .lbl{font-size:10px;color:var(--muted);}
.layout{display:flex;height:calc(100vh - 55px);}
.sidebar{width:208px;min-width:208px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:10px 0;}
.ss{padding:7px 13px 3px;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.sb{display:flex;align-items:center;justify-content:space-between;padding:6px 13px;cursor:pointer;border:none;background:none;color:var(--text);font-family:inherit;font-size:12.5px;width:100%;transition:background .12s;}
.sb:hover{background:var(--surface2);}
.sb.active{background:rgba(79,142,247,.15);color:var(--accent);font-weight:700;}
.sb .cnt{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}
.sb.active .cnt{color:var(--accent);}
.main{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:15px 17px;}
.ct{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.rt{background:rgba(79,142,247,.2);color:var(--accent);font-size:11px;padding:2px 8px;border-radius:4px;font-weight:700;text-transform:none;}
.tt{margin-left:auto;font-size:13px;color:var(--text);font-weight:700;font-family:'DM Mono',monospace;}
.tabs{display:flex;gap:3px;margin-bottom:0;}
.tab{padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface2);border:1px solid var(--border);transition:all .12s;}
.tab:hover{color:var(--text);}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.top-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
/* type bars */
.tbs{display:flex;flex-direction:column;gap:6px;}
.tr{display:flex;align-items:center;gap:9px;}
.tl{width:126px;min-width:126px;font-size:12px;color:var(--text);cursor:help;}
.bw{flex:1;background:var(--surface2);border-radius:3px;height:21px;overflow:hidden;}
.b{height:100%;border-radius:3px;display:flex;align-items:center;padding-left:7px;font-size:11px;font-weight:700;color:rgba(255,255,255,.92);min-width:4px;transition:width .4s;}
.tn{width:42px;min-width:42px;text-align:right;font-family:'DM Mono',monospace;font-size:12px;font-weight:700;}
.tp{width:40px;min-width:40px;text-align:right;font-size:11px;color:var(--muted);}
/* heatmap */
.hw{overflow-x:auto;}
table.hm{width:100%;border-collapse:collapse;font-size:11px;}
table.hm th{background:var(--surface2);color:var(--muted);padding:6px 4px;text-align:center;font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:5;}
table.hm th.cr{text-align:left;padding-left:11px;min-width:76px;}
table.hm td{padding:4px 4px;text-align:center;border-bottom:1px solid rgba(42,47,61,.5);font-family:'DM Mono',monospace;}
table.hm td.cr{text-align:left;padding-left:11px;font-family:'Noto Sans KR',sans-serif;font-weight:500;color:var(--text);white-space:nowrap;}
table.hm td.ct-c{font-weight:700;color:var(--text);}
table.hm tr:hover td{background:rgba(255,255,255,.022);}
/* 0건 행 스타일 */
table.hm tr.zero-row td{opacity:.45;}
table.hm tr.zero-row td.cr{color:var(--muted);font-style:italic;}
table.hm tr.zero-row td.ct-c{color:var(--muted);}
.zero-badge{display:inline-block;font-size:9px;background:var(--surface2);color:var(--muted);border:1px solid var(--border);border-radius:3px;padding:1px 5px;margin-left:5px;vertical-align:middle;font-family:'Noto Sans KR',sans-serif;font-weight:400;letter-spacing:0;}
/* heat colors */
.h0{color:#3a3f52;}
.h1{background:rgba(79,142,247,.12);color:#90b8ff;}
.h2{background:rgba(79,142,247,.28);color:#b0ccff;}
.h3{background:rgba(79,142,247,.46);color:#d0e2ff;}
.h4{background:rgba(79,142,247,.65);color:#fff;font-weight:700;}
.h5{background:rgba(240,90,90,.6);color:#fff;font-weight:700;}
/* jiwon cards */
.jg{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:11px;}
.jc{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:12px 14px;}
.jc.zero{opacity:.5;border-style:dashed;}
.jn{font-weight:700;font-size:13px;margin-bottom:2px;display:flex;align-items:center;gap:6px;}
.jt{font-size:11px;color:var(--muted);margin-bottom:8px;font-family:'DM Mono',monospace;}
.mb{display:flex;flex-direction:column;gap:3px;}
.mr{display:flex;align-items:center;gap:5px;}
.ml{width:76px;min-width:76px;font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mbw{flex:1;background:var(--bg);border-radius:2px;height:13px;overflow:hidden;}
.mbar{height:100%;border-radius:2px;display:flex;align-items:center;padding-left:4px;font-size:10px;font-weight:700;color:rgba(255,255,255,.9);min-width:4px;}
.mc{width:24px;text-align:right;font-size:10px;font-family:'DM Mono',monospace;color:var(--muted);}
.zero-msg{font-size:11px;color:var(--muted);padding:6px 0;font-style:italic;}
/* legend */
.legend-zero{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.lz-box{width:12px;height:12px;border:1px dashed var(--muted);border-radius:2px;flex-shrink:0;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>

  h+=`<button class="sb ${CS==='전국'?'active':''}" onclick="sel('전국')"><span>전국</span><span class="cnt">${D.total.합계.toLocaleString()}</span></button>`;
  h+=`<div class="ss" style="margin-top:5px">17 시도</div>`;
  D.sido.forEach(s=>{
    const zc=D.jiwon.filter(j=>j.시도===s.시도&&j.합계===0).length;
    const ztag=zc>0?`<span style="font-size:9px;color:#666;margin-left:3px">(0건 ${zc})</span>`:'';
    h+=`<button class="sb ${CS===s.시도?'active':''}" onclick="sel('${s.시도}')">
      <span>${s.시도}${ztag}</span><span class="cnt">${s.합계.toLocaleString()}</span></button>`;
  });
  document.getElementById('sidebar').innerHTML=h;
}

function rMain(){
  const d=gd(),tot=d.합계;
  const tabs=`<div class="top-bar"><div class="tabs">
    <div class="tab ${CT==='type'?'active':''}" onclick="tab('type')">침해유형 분석</div>
    <div class="tab ${CT==='hm'?'active':''}" onclick="tab('hm')">히트맵 테이블</div>
    <div class="tab ${CT==='jw'?'active':''}" onclick="tab('jw')">지원청 상세</div>
  </div></div>`;
  let content='';
  if(CT==='type') content=rType(d,tot);
  else if(CT==='hm') content=rHM();
  else content=rJW();
  document.getElementById('main').innerHTML=tabs+content;
}

function rType(d,tot){
  const mx=Math.max(...D.type_order.map(t=>d[t]||0));
  const bars=D.type_order.map(t=>{
    const c=d[t]||0,p=tot?(c/tot*100).toFixed(1):'0.0';
    const w=mx?Math.max(c/mx*100,c>0?2:0):0;
    const col=TC[t]||'#666';
    return `<div class="tr"><div class="tl" title="${D.type_full[t]||t}">${t}</div>
      <div class="bw"><div class="b" style="width:${w}%;background:${col}">${c>0?c:''}</div></div>
      <div class="tn">${c.toLocaleString()}</div><div class="tp">${p}%</div></div>`;
  }).join('');
  const rl=CS==='전국'?'전국':CS;
  let extra='';
  if(CS==='전국'){
    const t3=['⑤모욕/명예훼손','⑪생활지도불응','③상해/폭행'];
    const hd=t3.map(t=>`<th title="${D.type_full[t]||t}">${t}</th>`).join('');
    const rows=D.sido.map(s=>{
      const cs=t3.map(t=>`<td>${s[t]||0} <span style="color:var(--muted);font-size:10px">(${s.합계?((s[t]||0)/s.합계*100).toFixed(1):0}%)</span></td>`).join('');
      return `<tr><td class="cr" style="font-family:inherit;font-weight:500">${s.시도}</td><td class="ct-c">${s.합계.toLocaleString()}</td>${cs}</tr>`;
    }).join('');
    extra=`<div class="card"><div class="ct">시도별 주요 침해유형 비교</div>
      <div class="hw"><table class="hm"><thead><tr><th class="cr">시도</th><th>합계</th>${hd}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
  } else {
    extra=rJWMini();
  }
  return `<div class="card"><div class="ct">침해 유형별 현황<span class="rt">${rl}</span><span class="tt">총 ${tot.toLocaleString()}건</span></div>
    <div class="tbs">${bars}</div></div>${extra}`;
}

function rJWMini(){
  const jws=gj().slice(0,12);if(!jws.length)return '';
  const cards=jws.map(j=>{
    if(j.합계===0){
      return `<div class="jc zero"><div class="jn">${j.지원청}<span class="zero-badge">0건</span></div>
        <div class="jt">사안 없음</div><div class="zero-msg">2025학년도 1·2학기 침해 사안 없음</div></div>`;
    }
    const top=D.type_order.map(t=>({t,c:j[t]||0})).filter(x=>x.c>0).sort((a,b)=>b.c-a.c).slice(0,4);
    const mx=top[0]?.c||1;
    const mb=top.map(({t,c})=>`<div class="mr"><div class="ml" title="${D.type_full[t]||t}">${t}</div>
      <div class="mbw"><div class="mbar" style="width:${c/mx*100}%;background:${TC[t]||'#666'}">${c>5?c:''}</div></div>
      <div class="mc">${c}</div></div>`).join('');
    return `<div class="jc"><div class="jn">${j.지원청}</div><div class="jt">총 ${j.합계.toLocaleString()}건</div><div class="mb">${mb}</div></div>`;
  }).join('');
  return `<div class="card"><div class="ct">교육지원청별 주요 침해유형<span class="rt">${CS}</span></div><div class="jg">${cards}</div></div>`;
}

function rHM(){
  const types=D.type_order;
  if(CS==='전국'){
    const cm={};
    types.forEach(t=>{cm[t]=Math.max(...D.sido.map(s=>s[t]||0),1);});
    const hd=types.map(t=>`<th title="${D.type_full[t]||t}">${t.slice(0,3)}</th>`).join('');
    const rows=D.sido.map(s=>{
      const cs=types.map(t=>`<td class="${hc(s[t]||0,cm[t])}">${(s[t]||0)||''}</td>`).join('');
      return `<tr><td class="cr">${s.시도}</td><td class="ct-c">${s.합계.toLocaleString()}</td>${cs}</tr>`;
    }).join('');
    return `<div class="card"><div class="ct">시도 × 침해유형 히트맵
        <span style="margin-left:auto;font-size:10px;color:var(--muted);font-weight:400;text-transform:none">색 진할수록 건수 많음</span></div>
      <div class="hw"><table class="hm"><thead><tr><th class="cr">시도</th><th>합계</th>${hd}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
  } else {
    const jws=gj();
    const nonZero=jws.filter(j=>j.합계>0);
    const cm={};
    types.forEach(t=>{cm[t]=Math.max(...nonZero.map(j=>j[t]||0),1);});
    const hd=types.map(t=>`<th title="${D.type_full[t]||t}">${t.slice(0,3)}</th>`).join('');
    const rows=jws.map(j=>{
      const isZ=j.합계===0;
      const zc=isZ?` class="zero-row"`:'';
      const cs=types.map(t=>{
        const v=j[t]||0;
        const cls=isZ?'h0':hc(v,cm[t]);
        return `<td class="${cls}">${v||''}</td>`;
      }).join('');
      const nameCell=isZ
        ?`<td class="cr">${j.지원청}<span class="zero-badge">0건</span></td>`
        :`<td class="cr">${j.지원청}</td>`;
      return `<tr${zc}>${nameCell}<td class="ct-c">${j.합계||'0'}</td>${cs}</tr>`;
    }).join('');
    const zeroCount=jws.filter(j=>j.합계===0).length;
    const legendZ=zeroCount>0?`<div class="legend-zero"><div class="lz-box"></div>흐릿하게 표시된 행(${zeroCount}개)은 2025학년도 1·2학기 침해 사안이 없는 지원청입니다.</div>`:'';
    return `<div class="card"><div class="ct">지원청 × 침해유형 히트맵<span class="rt">${CS}</span>
        <span style="margin-left:auto;font-size:10px;color:var(--muted);font-weight:400;text-transform:none">전체 ${jws.length}개 지원청</span></div>
      <div class="hw"><table class="hm"><thead><tr><th class="cr">지원청</th><th>합계</th>${hd}</tr></thead><tbody>${rows}</tbody></table></div>
      ${legendZ}</div>`;
  }
}

function rJW(){
  let jws=gj();
  if(CS==='전국'){
    // 전국: 합계 내림차순, 0건은 맨 아래
    const nonZ=[...D.jiwon].filter(j=>j.합계>0).sort((a,b)=>b.합계-a.합계);
    const zeros=[...D.jiwon].filter(j=>j.합계===0);
    jws=[...nonZ.slice(0,30),...zeros];
  }
  const zCount=jws.filter(j=>j.합계===0).length;
  const cards=jws.map(j=>{
    if(j.합계===0){
      const sido=CS==='전국'?`<span style="font-size:10px;color:var(--muted);margin-right:3px">[${j.시도}]</span>`:'';
      return `<div class="jc zero"><div class="jn">${sido}${j.지원청}<span class="zero-badge">0건</span></div>
        <div class="jt">사안 없음</div><div class="zero-msg">2025학년도 1·2학기 침해 사안 없음</div></div>`;
    }
    const top=D.type_order.map(t=>({t,c:j[t]||0})).filter(x=>x.c>0).sort((a,b)=>b.c-a.c).slice(0,5);
    const mx=top[0]?.c||1;
    const mb=top.map(({t,c})=>`<div class="mr"><div class="ml" title="${D.type_full[t]||t}">${t}</div>
      <div class="mbw"><div class="mbar" style="width:${c/mx*100}%;background:${TC[t]||'#666'}">${c>5?c:''}</div></div>
      <div class="mc">${c}</div></div>`).join('');
    const sido=CS==='전국'?`<span style="font-size:10px;color:var(--muted);margin-right:3px">[${j.시도}]</span>`:'';
    return `<div class="jc"><div class="jn">${sido}${j.지원청}</div><div class="jt">총 ${j.합계.toLocaleString()}건</div><div class="mb">${mb}</div></div>`;
  }).join('');

  const titlePrefix=CS==='전국'?`전국 상위 30개 지원청 + 0건 지원청 (${zCount}개)`:
    `${CS} 전체 지원청 ${jws.length}개`;
  return `<div class="card"><div class="ct">${titlePrefix} — 침해유형 분포</div>
    <div class="jg">${cards}</div>
    ${zCount>0?`<div class="legend-zero"><div class="lz-box"></div>점선 테두리 카드(${zCount}개)는 2025학년도 1·2학기 침해 사안이 없는 지원청입니다.</div>`:''}
  </div>`;
}

rSB();rMain();
</script>
</body>
</html>
